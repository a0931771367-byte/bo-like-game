name: Game data check

on:
  push:
    paths: [unity/Assets/Resources/**, tools/check_game_data.py]
  pull_request:
    paths: [unity/Assets/Resources/**, tools/check_game_data.py]
  workflow_dispatch:

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_game_data.py
