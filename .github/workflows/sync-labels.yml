name: Sync issue labels

on:
  push:
    branches: [main]
    paths: [.github/labels.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yq -o=json '.[]' .github/labels.yml | jq -c '.' | while read -r l; do
            gh label create "$(jq -r .name <<<"$l")" \
              --color "$(jq -r .color <<<"$l")" \
              --description "$(jq -r .description <<<"$l")" \
              --force --repo "$GITHUB_REPOSITORY"
          done
